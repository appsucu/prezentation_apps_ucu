<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .title { font-family: "Manrope", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; }
    .text-sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Title & Subtitle Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="4" width="22" height="3" fill="#8cc63f" rx="1.5" />
    <text x="32" y="9" class="text-sans" font-size="10.5" font-weight="800" fill="#70278c" letter-spacing="0.16em">НАВЧАЛЬНИЙ ПРОЦЕС · 4 РОКИ</text>
    <text x="0" y="38" class="title" font-size="24" fill="#1e2229" letter-spacing="-0.03em">Що вас чекає на програмі?</text>
  </g>

  <!-- Timeline Track connecting all 4 years -->
  <g transform="translate(40, 88)">
    <rect x="30" y="15" width="660" height="3" fill="#e2e8f0" rx="1.5" />
    <rect x="30" y="15" width="330" height="3" fill="#70278c" rx="1.5" />
    <rect x="360" y="15" width="330" height="3" fill="#8cc63f" rx="1.5" />

    <!-- Step 1 Node -->
    <circle cx="85" cy="16.5" r="14" fill="#70278c" />
    <text x="85" y="20.5" class="title" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="85" y="44" class="text-sans" font-size="11" font-weight="700" fill="#1e2229" text-anchor="middle">1-й рік</text>

    <!-- Step 2 Node -->
    <circle cx="265" cy="16.5" r="14" fill="#70278c" />
    <text x="265" y="20.5" class="title" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="265" y="44" class="text-sans" font-size="11" font-weight="700" fill="#1e2229" text-anchor="middle">2-й рік</text>

    <!-- Step 3 Node -->
    <circle cx="455" cy="16.5" r="14" fill="#8cc63f" />
    <text x="455" y="20.5" class="title" font-size="11" font-weight="800" fill="#1e2229" text-anchor="middle">3</text>
    <text x="455" y="44" class="text-sans" font-size="11" font-weight="700" fill="#1e2229" text-anchor="middle">3-й рік</text>

    <!-- Step 4 Node -->
    <circle cx="635" cy="16.5" r="14" fill="#8cc63f" />
    <text x="635" y="20.5" class="title" font-size="11" font-weight="800" fill="#1e2229" text-anchor="middle">4</text>
    <text x="635" y="44" class="text-sans" font-size="11" font-weight="700" fill="#1e2229" text-anchor="middle">4-й рік</text>
  </g>

  <!-- Two Main Phase Cards (Flat, white, border-line, border-t accent) -->
  <!-- Card 1: Перші 2 роки (Фундамент) -->
  <g transform="translate(40, 160)">
    <rect width="348" height="206" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="0" y="0" width="348" height="3" fill="#70278c" rx="1.5" />

    <rect x="20" y="16" width="88" height="22" rx="4" fill="#70278c" fill-opacity="0.08" stroke="#70278c" stroke-opacity="0.2" stroke-width="1" />
    <text x="64" y="31" class="text-sans" font-size="10" font-weight="900" fill="#70278c" text-anchor="middle" letter-spacing="0.06em">ПЕРШІ 2 РОКИ</text>

    <text x="20" y="58" class="title" font-size="15" fill="#1e2229">Побудова міцного фундаменту</text>

    <g transform="translate(20, 78)">
      <circle cx="5" cy="5" r="3" fill="#70278c" />
      <text x="16" y="9" class="text-sans" font-size="12" font-weight="700" fill="#1e2229">Вища математика</text>
      <text x="134" y="9" class="text-sans" font-size="12" fill="#5e6672">та дискретні структури</text>

      <circle cx="5" cy="28" r="3" fill="#70278c" />
      <text x="16" y="32" class="text-sans" font-size="12" font-weight="700" fill="#1e2229">Мови C++, Python,</text>
      <text x="134" y="32" class="text-sans" font-size="12" fill="#5e6672">парадигми ООП</text>

      <circle cx="5" cy="51" r="3" fill="#70278c" />
      <text x="16" y="55" class="text-sans" font-size="12" font-weight="700" fill="#1e2229">Алгоритми</text>
      <text x="90" y="55" class="text-sans" font-size="12" fill="#5e6672">та структури даних, ОС</text>

      <circle cx="5" cy="74" r="3" fill="#70278c" />
      <text x="16" y="78" class="text-sans" font-size="12" font-weight="700" fill="#1e2229">Принципи організації</text>
      <text x="160" y="78" class="text-sans" font-size="12" fill="#5e6672">комп’ютера</text>
    </g>
  </g>

  <!-- Card 2: Наступні 2 роки (Траєкторія) -->
  <g transform="translate(412, 160)">
    <rect width="348" height="206" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="0" y="0" width="348" height="3" fill="#8cc63f" rx="1.5" />

    <rect x="20" y="16" width="102" height="22" rx="4" fill="#8cc63f" fill-opacity="0.14" stroke="#8cc63f" stroke-opacity="0.3" stroke-width="1" />
    <text x="71" y="31" class="text-sans" font-size="10" font-weight="900" fill="#32570a" text-anchor="middle" letter-spacing="0.06em">НАСТУПНІ 2 РОКИ</text>

    <text x="20" y="58" class="title" font-size="15" fill="#1e2229">Власна освітня траєкторія</text>

    <g transform="translate(20, 78)">
      <circle cx="5" cy="5" r="3" fill="#8cc63f" />
      <text x="16" y="9" class="text-sans" font-size="12" font-weight="700" fill="#1e2229">Вибіркові курси</text>
      <text x="122" y="9" class="text-sans" font-size="12" fill="#5e6672">під власний фокус</text>

      <circle cx="5" cy="28" r="3" fill="#8cc63f" />
      <text x="16" y="32" class="text-sans" font-size="12" font-weight="700" fill="#1e2229">Штучний інтелект</text>
      <text x="138" y="32" class="text-sans" font-size="12" fill="#5e6672">&amp; Data Science</text>

      <circle cx="5" cy="51" r="3" fill="#8cc63f" />
      <text x="16" y="55" class="text-sans" font-size="12" font-weight="700" fill="#1e2229">Software Engineering</text>
      <text x="156" y="55" class="text-sans" font-size="12" fill="#5e6672">&amp; хмарні сервіси</text>

      <circle cx="5" cy="74" r="3" fill="#8cc63f" />
      <text x="16" y="78" class="text-sans" font-size="12" font-weight="700" fill="#1e2229">Дипломний проєкт</text>
      <text x="142" y="78" class="text-sans" font-size="12" fill="#5e6672">та дослідження</text>
    </g>
  </g>

  <!-- Track «По дорозі»: Наскрізні можливості (Flat Chips) -->
  <g transform="translate(40, 392)">
    <g transform="translate(0, 0)">
      <text x="0" y="12" class="title" font-size="11" font-weight="800" fill="#70278c">↗</text>
      <text x="16" y="12" class="text-sans" font-size="10.5" font-weight="800" fill="#5e6672" letter-spacing="0.1em">ПО ДОРОЗІ · ДОСВІД ТА МОЖЛИВОСТІ</text>
    </g>

    <g transform="translate(0, 24)">
      <g transform="translate(0, 0)">
        <rect width="126" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="20" class="text-sans" font-size="11.5" font-weight="700" fill="#1e2229">Власні проєкти</text>
      </g>
      <g transform="translate(134, 0)">
        <rect width="116" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="20" class="text-sans" font-size="11.5" font-weight="700" fill="#1e2229">Дослідження</text>
      </g>
      <g transform="translate(258, 0)">
        <rect width="118" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="20" class="text-sans" font-size="11.5" font-weight="700" fill="#1e2229">Стажування</text>
      </g>
      <g transform="translate(384, 0)">
        <rect width="156" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="20" class="text-sans" font-size="11.5" font-weight="700" fill="#1e2229">Міжнародні обміни</text>
      </g>
      <g transform="translate(548, 0)">
        <rect width="110" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="20" class="text-sans" font-size="11.5" font-weight="700" fill="#1e2229">Змагання</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar (Flat solid purple with green accent) -->
  <g transform="translate(40, 480)">
    <rect width="720" height="38" rx="8" fill="#70278c" />
    <rect x="0" y="0" width="8" height="38" fill="#8cc63f" rx="2" />
    <text x="360" y="24" class="title" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.1em">4 РОКИ НАВЧАННЯ · СПЕЦІАЛЬНІСТЬ F3 «КОМП’ЮТЕРНІ НАУКИ»</text>
  </g>
</svg>